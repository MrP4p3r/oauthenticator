[project]
name = "oauthenticator"
version = "0.1.0"
description = "CLI for the OAuth2/OIDC authorization code flow, with a browser callback and token inspection page"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
oauthenticator = "oauthenticator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oauthenticator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "cryptography>=50.0.0",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
]
